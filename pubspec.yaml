name: lingua_viaje
description: >-
  LinguaViaje — snap a menu, speak a phrase, point a camera. Instant Spanish,
  Basque (Euskara) and English translation for travelers eating their way
  through Spain. Powered by GPT-4o, Whisper and native TTS. Offline history,
  private by default.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.8.1

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1
  path: ^1.9.1

  # Audio
  record: ^6.2.0
  audioplayers: ^6.1.0

  # Camera & Image
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0

  # Permissions
  permission_handler: ^11.3.1

  # Connectivity
  connectivity_plus: ^6.1.1

  # UI & Theming
  flutter_animate: ^4.5.0

  # Utilities
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Italic.ttf
          style: italic
